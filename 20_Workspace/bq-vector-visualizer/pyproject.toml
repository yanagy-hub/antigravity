[project]
name = "bq-vector-visualizer"
version = "0.1.0"
description = "BigQuery高次元ベクトル情報の対話型可視化・探索ツール (Streamlit + Plotly + Gemini)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38.0",
    "google-cloud-bigquery>=3.25.0",
    "db-dtypes>=1.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",
    "umap-learn>=0.5.6",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.1",
]
